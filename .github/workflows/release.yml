name: Release File

on:
  push:
    tags:
    - 'v*'
  # Allows dispatching the build matrix from the Actions tab or `gh workflow
  # run` for CI verification; release steps are tag guarded, so a manual run
  # on a branch only compiles.
  workflow_dispatch:

jobs:

  build:

    strategy:
      # One failed architecture must not cancel the other parallel builds.
      fail-fast: false
      matrix:
        include:
          # Windows ships x64 only: the Explorer shell extension is a x64
          # in-proc COM server.
          - os: windows
            arch: x64
            runner: windows-latest
          - os: macos
            arch: x64
            runner: macos-15-intel
          - os: macos
            arch: arm64
            runner: macos-15
          - os: ubuntu
            arch: x64
            runner: ubuntu-latest
          - os: ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install NativeAOT prerequisites (Linux)
      if: matrix.os == 'ubuntu'
      run: >
        sudo apt-get update &&
        sudo apt-get install -y clang zlib1g-dev

    - name: Publish
      shell: pwsh
      run: cd scripts && ./publish-all.ps1 -os ${{ matrix.os }} -arch ${{ matrix.arch }}

    - name: Zipping All
      if: matrix.os == 'windows'
      uses: vimtor/action-zip@v1
      with:
          files: ./build
          dest: SPRView.Net-${{ matrix.os }}-${{ matrix.arch }}.zip

    - name: Tarball All
      if: matrix.os != 'windows'
      run: tar -czvf ./SPRView.Net-${{ matrix.os }}-${{ matrix.arch }}.tar.gz ./build

    - name: Create Release Unix
      if: matrix.os != 'windows' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
          # github.ref is "refs/tags/vX", which produced titles like
          # "SPRView.Net-refs/tags/vX"; the version alone is what belongs here.
          name: SPRView.Net ${{ github.ref_name }}
          files: |
            ./SPRView.Net-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

    - name: Create Release Win
      if: matrix.os == 'windows' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
          # github.ref is "refs/tags/vX", which produced titles like
          # "SPRView.Net-refs/tags/vX"; the version alone is what belongs here.
          name: SPRView.Net ${{ github.ref_name }}
          files: |
            SPRView.Net-${{ matrix.os }}-${{ matrix.arch }}.zip
