name: Release File

on:
  push:
    tags:
    - 'v*'
  # Allows dispatching the build matrix from the Actions tab or `gh workflow
  # run` for CI verification; release steps are tag guarded, so a manual run
  # on a branch only compiles.
  workflow_dispatch:

jobs:

  build:

    strategy:
      # One failed architecture must not cancel the other parallel builds.
      fail-fast: false
      matrix:
        include:
          # Windows ships x64 only: the Explorer shell extension is a x64
          # in-proc COM server.
          - os: windows
            arch: x64
            runner: windows-latest
          - os: macos
            arch: x64
            runner: macos-15-intel
          - os: macos
            arch: arm64
            runner: macos-15
          - os: ubuntu
            arch: x64
            runner: ubuntu-latest
          - os: ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install NativeAOT prerequisites (Linux)
      if: matrix.os == 'ubuntu'
      run: >
        sudo apt-get update &&
        sudo apt-get install -y clang zlib1g-dev

    - name: Publish
      shell: pwsh
      run: cd scripts && ./publish-all.ps1 -os ${{ matrix.os }} -arch ${{ matrix.arch }}

    - name: Zipping All
      if: matrix.os == 'windows'
      uses: vimtor/action-zip@v1
      with:
          files: ./build
          dest: SPRView.Net-${{ matrix.os }}-${{ matrix.arch }}.zip

    - name: Tarball All
      if: matrix.os != 'windows'
      run: tar -czvf ./SPRView.Net-${{ matrix.os }}-${{ matrix.arch }}.tar.gz ./build

    # The five platform jobs run in parallel and all publish into one release,
    # so creating it is a race: whichever loses fails with "already_exists". The
    # gh CLI is used instead of action-gh-release because it can be made
    # idempotent, and the tag is passed explicitly, since the action otherwise
    # looks it up as "refs/tags/vX" and never finds it.
    #
    - name: Publish to release (Unix)
      if: matrix.os != 'windows' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARTIFACT: SPRView.Net-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
      run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # --verify-tag keeps a missing tag a hard error, and a failure here
            # most likely means another job won the race, which is fine.
            gh release create "$TAG" --title "SPRView.Net $TAG" --verify-tag || true
          fi
          gh release upload "$TAG" "$ARTIFACT" --clobber

    - name: Publish to release (Windows)
      if: matrix.os == 'windows' && startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARTIFACT: SPRView.Net-${{ matrix.os }}-${{ matrix.arch }}.zip
      run: |
          if (-not (gh release view $env:TAG 2>$null)) {
            gh release create $env:TAG --title "SPRView.Net $env:TAG" --verify-tag
            if ($LASTEXITCODE -ne 0) { Write-Host "another job created it first" }
          }
          gh release upload $env:TAG $env:ARTIFACT --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
