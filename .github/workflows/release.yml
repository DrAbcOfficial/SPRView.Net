name: Release File

on:
  push:
    tags:
    - 'v*'
  # Allows dispatching the build matrix from the Actions tab or `gh workflow
  # run` for CI verification; the release job is tag guarded, so a manual run
  # on a branch only builds and uploads run artifacts.
  workflow_dispatch:

jobs:

  # Build and package on every target, in parallel. These jobs never touch the
  # release: they hand their archive to the run as an artifact. Publishing is a
  # separate job, which is what keeps five parallel jobs from racing to create
  # the same release.
  build:

    strategy:
      # One failed architecture must not cancel the other parallel builds.
      fail-fast: false
      matrix:
        include:
          # Windows ships x64 only: the Explorer shell extension is a x64
          # in-proc COM server.
          - os: windows
            arch: x64
            runner: windows-latest
          - os: macos
            arch: x64
            runner: macos-15-intel
          - os: macos
            arch: arm64
            runner: macos-15
          - os: ubuntu
            arch: x64
            runner: ubuntu-latest
          - os: ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install NativeAOT prerequisites (Linux)
      if: matrix.os == 'ubuntu'
      run: >
        sudo apt-get update &&
        sudo apt-get install -y clang zlib1g-dev

    - name: Publish
      shell: pwsh
      run: cd scripts && ./publish-all.ps1 -os ${{ matrix.os }} -arch ${{ matrix.arch }}

    - name: Zipping All
      if: matrix.os == 'windows'
      uses: vimtor/action-zip@v1
      with:
          files: ./build
          dest: SPRView.Net-${{ matrix.os }}-${{ matrix.arch }}.zip

    # Packed per platform rather than once at the end: the archive has to keep
    # the executable bits Unix expects, and artifact upload does not preserve
    # file modes.
    - name: Tarball All
      if: matrix.os != 'windows'
      run: tar -czvf ./SPRView.Net-${{ matrix.os }}-${{ matrix.arch }}.tar.gz ./build

    - name: Upload archive
      uses: actions/upload-artifact@v4
      with:
          name: SPRView.Net-${{ matrix.os }}-${{ matrix.arch }}
          path: SPRView.Net-${{ matrix.os }}-${{ matrix.arch }}.*
          # A build that produced nothing is a failure, not an empty release.
          if-no-files-found: error
          retention-days: 7

  # Collects what the matrix produced and publishes it as one release, so the
  # release is created exactly once and always carries every platform.
  release:
    needs: build
    # Only a tag publishes. A manual dispatch stops after the builds, which is
    # what makes this workflow usable for verifying a branch.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Download every archive
      uses: actions/download-artifact@v4
      with:
          # One directory holding all five, since they are published together.
          merge-multiple: true
          path: dist

    - name: Publish release
      env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh is told which repository to act on
          # rather than inferring it from a git remote that is not there.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
      run: |
          set -euo pipefail
          ls -l dist
          # A re-run can find the release already present from an earlier
          # attempt, so that case uploads into it instead of failing. --clobber
          # replaces an asset from the previous attempt.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" dist/* \
              --title "SPRView.Net $TAG" \
              --verify-tag
          fi
